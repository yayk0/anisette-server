services:
  anisette-server:
    image: ghcr.io/yayk0/anisette-server:latest
    container_name: anisette-server
    build:
      context: .
      args:
        UPSTREAM_REF: 2ef18d7da2abe3a6d070aa478f774538b947aaa2
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      - anisette-data:/home/Alcoholic/.config/anisette-v3/lib/
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6969/v3/client_info"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  anisette-data:
